name: Build and deploy MindMesh to AWS ECS

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Force ECS to roll out the newly pushed prod images (after Terraform services exist)."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: mindmesh-aws-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public build settings
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          API_URL: ${{ vars.API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PRIVACY_BUSINESS_NAME: ${{ vars.PRIVACY_BUSINESS_NAME }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          for key in AWS_REGION WEB_DOMAIN API_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY PRIVACY_BUSINESS_NAME PRIVACY_CONTACT_EMAIL; do
            if [[ -z "${!key}" ]]; then echo "Missing GitHub Actions variable: $key" >&2; exit 1; fi
          done
          [[ "$API_URL" == https://*/api ]] || { echo "API_URL must look like https://api.example.com/api" >&2; exit 1; }
          [[ "$SUPABASE_URL" == https://* ]] || { echo "SUPABASE_URL must use HTTPS" >&2; exit 1; }

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::880882846052:role/MindMesh-GitHub-Deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.cloud
          push: true
          tags: |
            880882846052.dkr.ecr.ap-south-1.amazonaws.com/mindmesh/api:prod
            880882846052.dkr.ecr.ap-south-1.amazonaws.com/mindmesh/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: true
          tags: |
            880882846052.dkr.ecr.ap-south-1.amazonaws.com/mindmesh/worker:prod
            880882846052.dkr.ecr.ap-south-1.amazonaws.com/mindmesh/worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push website
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            880882846052.dkr.ecr.ap-south-1.amazonaws.com/mindmesh/web:prod
            880882846052.dkr.ecr.ap-south-1.amazonaws.com/mindmesh/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_EXECUTION_MODE=cloud
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.WEB_DOMAIN }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_PRIVACY_BUSINESS_NAME=${{ vars.PRIVACY_BUSINESS_NAME }}
            NEXT_PUBLIC_PRIVACY_CONTACT_EMAIL=${{ vars.PRIVACY_CONTACT_EMAIL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Roll out images to ECS
        if: ${{ inputs.deploy }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          cluster="mindmesh-production"
          for service in mindmesh-production-api mindmesh-production-web mindmesh-production-worker; do
            aws ecs update-service --cluster "$cluster" --service "$service" --force-new-deployment --region "$AWS_REGION" >/dev/null
            echo "Started rollout: $service"
          done
